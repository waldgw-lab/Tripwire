      required: [name, role]
      properties:
        name: { type: string, minLength: 1 }
        role: { type: string, enum: [author, contributor, reporting, research, photography, editing, other] }
        attribution: { type: string }
    TrackedRecord:
      allOf:
        - { $ref: "#/components/schemas/RecordInput" }
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id: { type: string }
            createdAt: { type: string }
            updatedAt: { type: string }
    Observation:
      type: object
      required: [id, stage, articleId, journalist, attribution, evidence, observedAt, verified]
      properties:
        id: { type: string }
        stage: { type: string, enum: [origin, sourcing, addition, republication] }
        articleId: { type: string }
        journalist: { type: string }
        attribution: { type: string }
        evidence: { type: string }
        observedAt: { type: string }
        verified: { type: boolean }
        url: { type: string }
    Workspace:
      type: object
      required: [records, stats, lastRefreshed]
      properties:
        records: { type: array, items: { $ref: "#/components/schemas/TrackedRecord" } }
        access:
          type: object
          required: [signedIn, canEnrich]
          properties:
            signedIn: { type: boolean }
            canEnrich: { type: boolean }
        stats: { $ref: "#/components/schemas/Stats" }
        lastRefreshed: { type: ["string", "null"] }
    Stats:
      type: object
      required: [articles, claims, journalists, outlets, original, negative, positive]
      properties:
        articles: { type: integer }
        claims: { type: integer }
        journalists: { type: integer }
        outlets: { type: integer }
        original: { type: integer }
        negative: { type: integer }
        positive: { type: integer }
        flagged: { type: integer }
    RefreshResult:
      type: object
      required: [added, checked, failures, refreshedAt]
      properties:
        added: { type: integer }
        checked: { type: integer }
        failures: { type: array, items: { type: string } }
        refreshedAt: { type: string }
