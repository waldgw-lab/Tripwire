openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
servers:
  - url: /api
paths:
  /tripwire/claims/processing:
    get:
      operationId: getClaimProcessing
      responses:
        "200":
          description: Local retained-text claim processing, no publisher requests or paid models
          content:
            application/json:
              schema:
                type: object
                required: [policy, pending, failed, recent]
                properties:
                  policy: { type: string }
                  pending: { type: integer }
                  failed: { type: integer }
                  recent:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/ClaimProcessingRun"
                        - type: object
                          required: [title, history]
                          properties:
                            title: { type: string }
                            history:
                              type: array
                              items: { $ref: "#/components/schemas/ClaimProcessingRun" }
  /tripwire/claims/processing/{articleId}:
    post:
      operationId: processArticleClaims
      parameters:
        - { name: articleId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Queue retained article text, or safely retry an existing job
          content:
            application/json:
              schema:
                type: object
                required: [queued]
                properties:
                  queued: { type: boolean }
  /tripwire/provenance/direction:
    post:
      operationId: correctClaimDirection
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClaimDirectionInput" }
      responses:
        "200":
          description: Append a directional correction without changing evidence or truth/independence decisions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportingLinkResult" }
  /tripwire/claim-categories:
    get:
      operationId: getClaimCategories
      responses:
        "200":
          description: Development categories plus a needs-review fallback
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClaimCategory"
  /tripwire/provenance/summaries:
    get:
      operationId: getClaimCoverageSummaries
      responses:
        "200":
          description: Complete date ranges and article-attribution totals for claim previews, independent of detail pagination
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [claimId, attributions, firstDate, lastDate]
                  properties:
                    claimId: { type: string }
                    attributions: { type: integer }
                    firstDate: { type: ["string", "null"] }
                    lastDate: { type: ["string", "null"] }
                    ongoing: { type: boolean }
                    latestReportAt: { type: ["string", "null"] }
                    developmentType: { type: ["string", "null"] }
                    developmentReason: { type: ["string", "null"] }
                    categoryId: { type: string }
                    primaryCategory: { type: string }
                    secondaryCategories:
                      type: array
                      items: { $ref: "#/components/schemas/ClaimCategory" }
                    topicId: { type: string }
                    topicTitle: { type: string }
                    developments:
                      type: array
                      items: { type: string }
                    relatedSubjects:
                      type: array
                      items: { type: string }
                    placements:
                      type: array
                      items:
                        $ref: "#/components/schemas/ClaimArticlePlacement"
                    classificationReason: { type: string }
                    articleIds:
                      type: array
                      items: { type: string }
  /tripwire/provenance:
    get:
      operationId: getReportingProvenance
      parameters:
        - { name: evidenceScope, in: query, schema: { type: string, enum: [all, selected, retained-excerpt, superseded, unknown], default: all } }
        - { name: articleId, in: query, schema: { type: string } }
        - { name: claimId, in: query, schema: { type: string } }
        - { name: evidenceId, in: query, schema: { type: string } }
        - { name: eventId, in: query, schema: { type: string } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Integrated article sourcing, supplied analysis and reviewed chronological lineage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportingProvenance" }
    post:
      operationId: connectReportingPassage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportingPassageInput" }
      responses:
        "200":
          description: Evidence-backed article claim connected to existing Claims
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportingLinkResult" }
  /tripwire/provenance/reviews:
    post:
      operationId: reviewReportingLineage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportingReviewInput" }
      responses:
        "200":
          description: Append-only lineage assessment or correction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportingLinkResult" }
  /tripwire/entities:
    get:
      operationId: listEntities
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - { name: state, in: query, schema: { type: string, enum: [Discovered, Active, Watch, Archived] } }
        - { name: type, in: query, schema: { type: string, enum: [person, position, organization, company, capability, issue, event] } }
        - { name: classification, in: query, schema: { type: string, enum: [structural, strategic, contextual] } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        "200":
          description: Paginated private registry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntityPage" }
    post:
      operationId: createEntity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EntityInput" }
      responses:
        "200":
          description: Analyst discovery candidate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistryEntity" }
  /tripwire/entities/{id}:
    get:
      operationId: getEntity
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Bounded profile with evidence and history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntityDetail" }
    post:
      operationId: decideEntity
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EntityAction" }
      responses:
        "200":
          description: Updated entity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistryEntity" }
  /tripwire/entity-evidence:
    post:
      operationId: addEntityEvidence
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvidenceInput" }
      responses:
        "200":
          description: Validated retained passage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntityEvidence" }
  /tripwire/entity-captures:
    get:
      operationId: listEntityCaptures
      parameters:
        - { name: articleId, in: query, schema: { type: string } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Immutable capture references without bodies
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/EntityCapture" } }
                  total: { type: integer }
  /tripwire/developments:
    get:
      operationId: listDevelopments
      parameters:
        - { name: articleId, in: query, schema: { type: string } }
        - { name: disposition, in: query, schema: { type: string, enum: [Immediate, Review, Collection] } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Grouped material developments
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/EntityDevelopment" } }
                  total: { type: integer }
  /tripwire/developments/{id}:
    post:
      operationId: decideDevelopment
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DevelopmentAction" }
      responses:
        "200":
          description: Updated development
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntityDevelopment" }
  /tripwire/entity-automation:
    get:
      operationId: getEntityAutomation
      parameters:
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Processing health and release gates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationHealth" }
    post:
      operationId: controlEntityAutomation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutomationAction" }
      responses:
        "200":
          description: Processing health after control action
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationHealth" }
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /tripwire/workspace:
    get:
      operationId: getWorkspace
      responses:
        "200":
          description: Workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
  /tripwire/quick-enrichment:
    get:
      operationId: getQuickEnrichment
      responses:
        "200":
          description: Recent critical items needing article text and persistent paste jobs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuickEnrichmentQueue" }
    post:
      operationId: queueQuickEnrichment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuickEnrichmentInput" }
      responses:
        "202":
          description: Paste durably retained and queued for analysis and saving
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuickEnrichmentJob" }
  /tripwire/quick-enrichment/{id}/retry:
    post:
      operationId: retryQuickEnrichment
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Job queued again using its retained original paste
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuickEnrichmentJob" }
  /tripwire/quick-enrichment/{id}/text:
    get:
      operationId: getQuickEnrichmentText
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Original retained paste for restoring a failed edit
          content:
            application/json:
              schema:
                type: object
                required: [text]
                properties:
                  text: { type: string }
  /tripwire/records/{id}/content:
    get:
      operationId: getArticleContent
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: capture, in: query, schema: { type: string } }
        - { name: feedback, in: query, schema: { type: string, maxLength: 1000 } }
      responses:
        "200":
          description: Retained content for this article or selected source capture
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArticleContent" }
  /tripwire/content-search:
    get:
      operationId: searchArticleContent
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 300 } }
      responses:
        "200":
          description: Articles matching retained text
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentSearch" }
  /tripwire/retrieval:
    get:
      operationId: getRetrievalReport
      responses:
        "200":
          description: Actual per-outlet retrieval progress and durable storage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetrievalReport" }
    post:
      operationId: enqueueEnrichment
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                articleId: { type: string }
      responses:
        "200":
          description: Scheduled due items without bypassing publisher backoff
          content:
            application/json:
              schema:
                type: object
                required: [queued]
                properties:
                  queued: { type: integer }
  /tripwire/records:
    post:
      operationId: saveRecord
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordInput" }
      responses:
        "200":
          description: Saved record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrackedRecord" }
  /tripwire/records/{id}:
    delete:
      operationId: deleteRecord
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArticleDismissalInput" }
      responses:
        "204": { description: Deleted }
  /tripwire/records/{id}/classification:
    patch:
      operationId: correctArticleClassification
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArticleCorrectionInput" }
      responses:
        "200":
          description: Updated article
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrackedRecord" }
  /tripwire/records/{id}/restore:
    post:
      operationId: restoreArticle
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Restored article
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrackedRecord" }
  /tripwire/feedback:
    get:
      operationId: getArticleFeedback
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [analyst, all], default: analyst } }
        - { name: q, in: query, schema: { type: string, maxLength: 300 } }
        - { name: action, in: query, schema: { type: string, enum: [correction, deletion, restoration, system-correction] } }
        - { name: reason, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        "200":
          description: Workspace feedback history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArticleFeedbackPage" }
  /tripwire/feedback/{id}/article:
    get:
      operationId: getFeedbackArticle
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Retained article including dismissed items
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrackedRecord" }
  /tripwire/refresh:
    post:
      operationId: refreshFeeds
      responses:
        "200":
          description: Feed refresh results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RefreshResult" }
  /tripwire/records/{id}/flag:
    post:
      operationId: flagArticle
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FlagRequest" }
      responses:
        "200":
          description: Updated flag
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrackedRecord" }
  /tripwire/imports/uploads:
    post:
      operationId: requestImportUpload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportUploadRequest" }
      responses:
        "200":
          description: Private upload
          content:
            application/json:
              schema:
                type: object
                required: [uploadId, uploadUrl]
                properties:
                  uploadId: { type: string }
                  uploadUrl: { type: string }
  /tripwire/imports/analyze:
    post:
      operationId: analyzeImport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportAnalyzeRequest" }
      responses:
        "200":
          description: Import review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportDraft" }
  /tripwire/imports/commit:
    post:
      operationId: commitImport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportCommitRequest" }
      responses:
        "200":
          description: Enriched or created article
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrackedRecord" }
  /tripwire/imports/uploads/{id}/file:
    get:
      operationId: downloadImportFile
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Original private document
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
components:
  schemas:
    ClaimArticlePlacement:
      type: object
      required: [categoryId, primaryCategory, topicId, topicTitle, articleIds, developments, secondaryCategories]
      properties:
        categoryId: { type: string }
        primaryCategory: { type: string }
        topicId: { type: string }
        topicTitle: { type: string }
        articleIds: { type: array, items: { type: string } }
        developments: { type: array, items: { type: string } }
        relatedSubjects: { type: array, items: { type: string } }
        secondaryCategories:
          type: array
          items: { $ref: "#/components/schemas/ClaimCategory" }
        classificationReason: { type: string }
        firstDate: { type: ["string", "null"] }
        lastDate: { type: ["string", "null"] }
        latestReportAt: { type: ["string", "null"] }
        ongoing: { type: boolean }
    ClaimProcessingRun:
      type: object
      required: [jobId, articleId, status, claims, error, updatedAt, bodyCharacters, current]
      properties:
        jobId: { type: string }
        articleId: { type: string }
        status: { type: string }
        claims: { type: integer }
        error: { type: ["string", "null"] }
        updatedAt: { type: string }
        bodyCharacters: { type: ["integer", "null"] }
        current: { type: boolean }
    ClaimCategory:
      type: object
      required: [id, label, description]
      properties:
        id: { type: string }
        label: { type: string }
        description: { type: string }
    ClaimDirectionInput:
      type: object
      required: [claimObservationId, subject, direction, rationale]
      properties:
        claimObservationId: { type: string }
        subject: { type: string, minLength: 1, maxLength: 200 }
        direction: { type: string, enum: [positive, negative, neutral, mixed, unassessed] }
        rationale: { type: string, minLength: 5, maxLength: 2000 }
        supersedesId: { type: ["string", "null"] }
    ReportingLinkResult:
      type: object
      required: [id]
      properties:
        id: { type: string }
    ReportingPassageInput:
      type: object
      required: [articleId, claimId, captureId, excerpt, start, end, descriptor, proposition]
      properties:
        articleId: { type: string, minLength: 1 }
        claimId: { type: string, minLength: 1 }
        captureId: { type: string, minLength: 1 }
        evidenceId: { type: string, minLength: 1 }
        developmentId: { type: string, minLength: 1 }
        excerpt: { type: string, minLength: 1, maxLength: 20000 }
        start: { type: integer, minimum: 0 }
        end: { type: integer, minimum: 1 }
        descriptor: { type: string, minLength: 1, maxLength: 2000 }
        proposition: { type: string, minLength: 3, maxLength: 2000 }
        eventId: { type: ["string", "null"], maxLength: 200 }
        entityEventId: { type: ["string", "null"], maxLength: 200 }
        sourceIds: { type: array, maxItems: 20, items: { type: string } }
        anonymity: { type: string, enum: [Named, Unnamed, Unknown], default: Unknown }
    ReportingReviewInput:
      type: object
      required: [relation, rationale]
      properties:
        claimObservationId: { type: string }
        sourceMatchId: { type: string }
        targetClaimId: { type: ["string", "null"] }
        supersedesId: { type: ["string", "null"] }
        evidenceId: { type: ["string", "null"] }
        pathKey: { type: ["string", "null"], minLength: 3, maxLength: 200 }
        relation: { type: string, enum: [new-reporting, added-evidence, derivative, opinion-propagation, disputes, unknown, same-environment, distinct-environments, unresolved] }
        rationale: { type: string, minLength: 5, maxLength: 4000 }
    ReportingProvenance:
      type: object
      required: [claims, sources, matches, context, counts, total, offset]
      properties:
        claims: { type: array, items: { $ref: "#/components/schemas/ReportingClaim" } }
        sources: { type: array, items: { $ref: "#/components/schemas/ReportingSource" } }
        matches: { type: array, items: { $ref: "#/components/schemas/ReportingMatch" } }
        context: { type: array, items: { $ref: "#/components/schemas/ReportingContext" } }
        counts: { $ref: "#/components/schemas/ReportingCounts" }
        total: { type: integer }
        offset: { type: integer }
    ReportingCounts:
      type: object
      required: [articles, occurrences, minimumAnonymousHumans, provisionalSourceRecords, independentPaths]
      properties:
        articles: { type: integer }
        occurrences: { type: integer }
        minimumAnonymousHumans: { type: ["integer", "null"] }
        suppliedMinimumAnonymousHumans: { type: ["integer", "null"] }
        provisionalSourceRecords: { type: ["integer", "null"] }
        independentPaths: { type: ["integer", "null"] }
    ReportingReview:
      type: object
      required: [id, relation, rationale, createdAt]
      properties:
        id: { type: string }
        relation: { type: string }
        rationale: { type: string }
        createdAt: { type: string }
        pathKey: { type: ["string", "null"] }
        targetClaimId: { type: ["string", "null"] }
        supersedesId: { type: ["string", "null"] }
        evidenceId: { type: ["string", "null"] }
    ReportingEvidenceVersion:
      type: object
      required: [evidenceId, captureId, scope]
      properties:
        evidenceId: { type: ["string", "null"] }
        captureId: { type: ["string", "null"] }
        scope: { type: string, enum: [selected, retained-excerpt, superseded, unknown] }
        bodyHash: { type: ["string", "null"] }
        selectedBodyHash: { type: ["string", "null"] }
        source: { type: ["string", "null"] }
        capturedAt: { type: ["string", "null"] }
        excerpt: { type: ["string", "null"] }
        start: { type: ["integer", "null"] }
        end: { type: ["integer", "null"] }
    ReportingClaim:
      type: object
      required: [id, claimId, familyId, proposition, articleId, title, supplied, sourceIds, reviews]
      properties:
        direction: { type: string, enum: [positive, negative, neutral, mixed, unassessed] }
        directionSubject: { type: ["string", "null"] }
        directionReason: { type: ["string", "null"] }
        directionOrigin: { type: string, enum: [automatic, analyst, unassessed] }
        directionCorrectionId: { type: ["string", "null"] }
        evidenceScope: { type: string, enum: [selected, retained-excerpt, superseded, unknown] }
        displayedEvidenceVersion: { $ref: "#/components/schemas/ReportingEvidenceVersion" }
        evidenceVersions:
          type: array
          items: { $ref: "#/components/schemas/ReportingEvidenceVersion" }
        id: { type: string }
        claimId: { type: string }
        familyId: { type: string }
        proposition: { type: string }
        articleId: { type: string }
        title: { type: string }
        outlet: { type: ["string", "null"] }
        url: { type: ["string", "null"] }
        publishedAt: { type: ["string", "null"] }
        suppliedDate: { type: ["string", "null"] }
        eventId: { type: ["string", "null"] }
        evidenceId: { type: ["string", "null"] }
        excerpt: { type: ["string", "null"] }
        start: { type: ["integer", "null"] }
        end: { type: ["integer", "null"] }
        captureId: { type: ["string", "null"] }
        supplied: { type: boolean }
        externalId: { type: ["string", "null"] }
        sourceIds: { type: array, items: { type: string } }
        reviews: { type: array, items: { $ref: "#/components/schemas/ReportingReview" } }
    ReportingSource:
      type: object
      required: [id, articleId, descriptor, sourceType, anonymity, supplied, minimumHumans]
      properties:
