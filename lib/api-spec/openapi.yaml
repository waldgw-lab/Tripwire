openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
servers:
  - url: /api
paths:
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /tripwire/workspace:
    get:
      operationId: getWorkspace
      responses:
        "200":
          description: Workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
  /tripwire/records/{id}/content:
    get:
      operationId: getArticleContent
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: capture, in: query, schema: { type: string } }
      responses:
        "200":
          description: Retained content for this article or selected source capture
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArticleContent" }
  /tripwire/content-search:
    get:
      operationId: searchArticleContent
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 300 } }
      responses:
        "200":
          description: Articles matching retained text
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentSearch" }
  /tripwire/retrieval:
    get:
      operationId: getRetrievalReport
      responses:
        "200":
          description: Actual per-outlet retrieval progress and durable storage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetrievalReport" }
    post:
      operationId: enqueueEnrichment
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                articleId: { type: string }
      responses:
        "200":
          description: Scheduled due items without bypassing publisher backoff
          content:
            application/json:
              schema:
                type: object
                required: [queued]
                properties:
                  queued: { type: integer }
  /tripwire/records:
    post:
      operationId: saveRecord
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordInput" }
      responses:
        "200":
          description: Saved record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrackedRecord" }
  /tripwire/records/{id}:
    delete:
      operationId: deleteRecord
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
  /tripwire/refresh:
    post:
      operationId: refreshFeeds
      responses:
        "200":
          description: Feed refresh results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RefreshResult" }
  /tripwire/records/{id}/flag:
    post:
      operationId: flagArticle
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FlagRequest" }
      responses:
        "200":
          description: Updated flag
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrackedRecord" }
  /tripwire/imports/uploads:
    post:
      operationId: requestImportUpload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportUploadRequest" }
      responses:
        "200":
          description: Private upload
          content:
            application/json:
              schema:
                type: object
                required: [uploadId, uploadUrl]
                properties:
                  uploadId: { type: string }
                  uploadUrl: { type: string }
  /tripwire/imports/analyze:
    post:
      operationId: analyzeImport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportAnalyzeRequest" }
      responses:
        "200":
          description: Import review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportDraft" }
  /tripwire/imports/commit:
    post:
      operationId: commitImport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportCommitRequest" }
      responses:
        "200":
          description: Enriched or created article
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrackedRecord" }
  /tripwire/imports/uploads/{id}/file:
    get:
      operationId: downloadImportFile
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Original private document
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
components:
  schemas:
    FlagRequest:
      type: object
      required: [flagged]
      properties:
        flagged: { type: boolean }
    ImportUploadRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string }
        size: { type: integer, minimum: 1, maximum: 10485760 }
        contentType: { type: string }
    ImportAnalyzeRequest:
      type: object
      properties:
        text: { type: string, maxLength: 1000000 }
        url: { type: string }
        uploadId: { type: string }
        targetId: { type: string }
    ImportCommitRequest:
      type: object
      required: [draftId, title]
      properties:
        draftId: { type: string }
        title: { type: string, minLength: 1 }
        outlet: { type: string }
        url: { type: string }
        byline: { type: string }
        publishedAt: { type: string }
        sourceType: { type: string, enum: [article, x] }
        fullTextComplete: { type: boolean }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    RecordInput:
      type: object
      required: [kind, title]
      properties:
        id: { type: string }
        kind: { type: string, enum: [article, claim, watch, outlet] }
        title: { type: string, minLength: 1 }
        url: { type: string }
        outlet: { type: string }
        journalists: { type: array, items: { type: string } }
        byline: { type: string }
        credits:
          type: array
          items: { $ref: "#/components/schemas/ArticleCredit" }
        publishedAt: { type: string }
        fullText: { type: string }
        fullTextHash: { type: string }
        fullTextLength: { type: integer }
        contentNormalization: { $ref: "#/components/schemas/ContentNormalization" }
        contentType: { type: string }
        contentFormat: { type: string }
        classificationEvidence: { type: array, items: { $ref: "#/components/schemas/ClassificationEvidence" } }
        retrieval: { $ref: "#/components/schemas/Retrieval" }
        fullTextComplete: { type: boolean }
        retainedContent: { type: array, items: { $ref: "#/components/schemas/ContentCapture" } }
        contentRetained: { type: boolean }
        retainedCharacters: { type: integer }
        impact: { type: string, enum: [critical, high, low] }
        summary: { type: string }
        topic: { type: string }
        entities: { type: array, items: { type: string } }
        sentiment: { type: string, enum: [negative, positive, neutral, unassessed] }
        focus: { type: string, enum: [blame, performance, replacement, decision-making, institutional, other] }
        reportingType: { type: string, enum: [unassessed, original, independent, republication, commentary, official-response] }
        sourceType: { type: string, enum: [article, x, statement, document] }
        saved: { type: boolean }
        flagged: { type: boolean }
        flaggedAt: { type: string }
        articleId: { type: string }
        tier: { type: integer, minimum: 1, maximum: 3 }
        watchType: { type: string, enum: [person, position, organization, journalist, x-account, attribution, topic] }
        organization: { type: string }
        position: { type: string }
        individual: { type: string }
        aliases: { type: array, items: { type: string } }
        enabled: { type: boolean }
        feedUrl: { type: string }
        lastChecked: { type: string }
        feedStatus: { type: string }
        feedHealth:
          type: array
          items: { $ref: "#/components/schemas/FeedHealth" }
        intakeMethod: { type: string, enum: [rss, sitemap, google-news] }
        intakeUrl: { type: string }
        discoveryOnly: { type: boolean }
        discoveredAt: { type: string }
        observations:
          type: array
          items: { $ref: "#/components/schemas/Observation" }
    FeedHealth:
      type: object
      required: [url, kind, role, status, message, items]
      properties:
        url: { type: string }
        kind: { type: string, enum: [rss, sitemap, google-news] }
        role: { type: string, enum: [primary, supplement, fallback] }
        status: { type: string, enum: [connected, failed, stale, empty, standby] }
        checkedAt: { type: string }
        message: { type: string }
        items: { type: integer }
        latestItemAt: { type: string }
        nextAttemptAt: { type: string }
        failures: { type: integer }
    ContentCapture:
      type: object
      required: [id, source, capturedAt]
      properties:
        id: { type: string }
        text: { type: string }
        raw: { type: string }
        source: { type: string }
        sourceUrl: { type: string }
        capturedAt: { type: string }
        fileName: { type: string }
        uploadId: { type: string }
        bodyHash: { type: string }
        textLength: { type: integer }
        rawLength: { type: integer }
    ContentNormalization:
      type: object
      required: [method, sourceCharacters, articleCharacters]
      properties:
        method: { type: string }
        sourceCharacters: { type: integer }
        articleCharacters: { type: integer }
    ClassificationEvidence:
      type: object
      required: [signal, value]
      properties:
        signal: { type: string }
        value: { type: string }
        contentType: { type: string }
        contentFormat: { type: string }
        rank: { type: integer }
    Retrieval:
      type: object
      properties:
        status: { type: string }
        method: { type: string }
        lastAttempt: { type: string }
        nextAttemptAt: { type: string }
        message: { type: string }
        characters: { type: integer }
        rawCharacters: { type: integer }
        attempts: { type: integer }
    ArticleContent:
      type: object
      required: [text, raw, characters, rawCharacters]
      properties:
        text: { type: string }
        raw: { type: string }
        characters: { type: integer }
        rawCharacters: { type: integer }
    ContentSearch:
      type: object
      required: [articleIds]
      properties:
        articleIds: { type: array, items: { type: string } }
    RetrievalReport:
      type: object
      required: [outlets, storage]
      properties:
        outlets:
          type: array
          items:
            type: object
            required: [outlet, articles, retrieved, blocked, failed, pending, characters]
            properties:
              outlet: { type: string }
              articles: { type: integer }
              retrieved: { type: integer }
              blocked: { type: integer }
              failed: { type: integer }
              pending: { type: integer }
              characters: { type: integer }
              lastResult: { type: string }
        storage:
          type: object
          required: [blobs, characters]
          properties:
            blobs: { type: integer }
            characters: { type: integer }
    ImportDraft:
      type: object
      required: [draftId, candidate, warnings, characterCount, source]
      properties:
        draftId: { type: string }
        candidate: { $ref: "#/components/schemas/RecordInput" }
        matchedId: { type: string }
        matchReason: { type: string }
        warnings: { type: array, items: { type: string } }
        characterCount: { type: integer }
        source: { type: string }
    ArticleCredit:
      type: object
      required: [name, role]
      properties:
        name: { type: string, minLength: 1 }
        role: { type: string, enum: [author, contributor, reporting, research, photography, editing, other] }
        attribution: { type: string }
    TrackedRecord:
      allOf:
        - { $ref: "#/components/schemas/RecordInput" }
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id: { type: string }
            createdAt: { type: string }
            updatedAt: { type: string }
    Observation:
      type: object
      required: [id, stage, articleId, journalist, attribution, evidence, observedAt, verified]
      properties:
        id: { type: string }
        stage: { type: string, enum: [origin, sourcing, addition, republication] }
        articleId: { type: string }
        journalist: { type: string }
        attribution: { type: string }
        evidence: { type: string }
        observedAt: { type: string }
        verified: { type: boolean }
        url: { type: string }
    Workspace:
      type: object
      required: [records, stats, lastRefreshed]
      properties:
        records: { type: array, items: { $ref: "#/components/schemas/TrackedRecord" } }
        access:
          type: object
          required: [signedIn, canEnrich]
          properties:
            signedIn: { type: boolean }
            canEnrich: { type: boolean }
        stats: { $ref: "#/components/schemas/Stats" }
        lastRefreshed: { type: ["string", "null"] }
    Stats:
      type: object
      required: [articles, claims, journalists, outlets, original, negative, positive]
      properties:
        articles: { type: integer }
        claims: { type: integer }
        journalists: { type: integer }
        outlets: { type: integer }
        original: { type: integer }
        negative: { type: integer }
        positive: { type: integer }
        flagged: { type: integer }
    RefreshResult:
      type: object
      required: [added, checked, failures, refreshedAt]
      properties:
        added: { type: integer }
        checked: { type: integer }
        failures: { type: array, items: { type: string } }
        refreshedAt: { type: string }
