<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <script>
      // Apply the saved appearance before the app and its styles paint.
      (() => {
        let theme = 'dark';
        try { theme = localStorage.getItem('tripwire:theme') === 'light' ? 'light' : 'dark'; } catch {}
        const root = document.documentElement;
        root.classList.toggle('dark', theme === 'dark');
        root.dataset.theme = theme;
        root.style.colorScheme = theme;
      })();
    </script>
    <title>Tripwire</title>
    <meta name="description" content="Tripwire — built on Replit. Update this description to reflect the app." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Tripwire" />
    <meta property="og:description" content="Tripwire — built on Replit. Update this description to reflect the app." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tripwire" />
    <meta name="twitter:description" content="Tripwire — built on Replit. Update this description to reflect the app." />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%tripwire-icon-32.png" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="%BASE_URL%tripwire-icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
